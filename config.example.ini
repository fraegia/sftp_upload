; sftp_push configuration example.
; Copy to config.ini and edit. Paths: Windows form for local, / for remote.
; Put comments on their own line only.

[server]
host = 212.211.0.99
port = 22
user = root
; Full path of the private key (no passphrase). Recommended.
key_file = C:\Users\YOURUSER\.ssh\id_ed25519
; Used only if key_file is empty.
password =

[general]
; yes = delete local files after a verified upload
delete_after_copy = no
; Skip files modified in the last N seconds (still being written)
min_age_seconds = 10
; Only copy files modified in the last N days. 0 = no window.
ignore_older_than_days = 30
; 0 = check once and exit. Above 0 = keep running, check every N seconds.
interval_seconds = 30
; Rotated daily logs to keep
log_keep_days = 3

; One section per folder pair. Name must start with "job".
[job sessions]
local = C:\SessionAdapter\SessionAdapter\output\csv
remote = /data/centralsite/inbox/sessions
pattern = *.csv

[job reports]
local = C:\SessionAdapter\SessionAdapter\output\reports
remote = /data/centralsite/inbox/reports
pattern = *.pdf
